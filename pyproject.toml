[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specfreeze"
version = "0.2.0"
description = "Decision-driven LLM code generation: settle closed questions, freeze a contract, then implement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wasaf Abbasi" }]
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
specfreeze = "specfreeze.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specfreeze = ["data/catalogs/*.yaml", "data/demo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".specfreeze", "examples", "uploads", "agent-tools", ".git"]
