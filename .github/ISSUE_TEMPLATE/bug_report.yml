name: Bug report
description: Something in specfreeze does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste real host names, internal paths, credentials, or customer data. Replace them with `example.test` style placeholders.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - verify
        - catalog
        - ask/spec
        - build/fix
        - demo
        - provider
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command and a minimal, anonymised input file if you can.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python or PowerShell version"
