name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Demo and contract gate smoke test
        run: |
          specfreeze demo --out "$RUNNER_TEMP/demo" --quiet
          specfreeze verify "$RUNNER_TEMP/demo/portion.py" --contract "$RUNNER_TEMP/demo"
          specfreeze catalog check examples/portion/catalog.yaml src/specfreeze/data/catalogs/general.yaml
