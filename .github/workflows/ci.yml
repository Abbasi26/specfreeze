name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Demo and contract gate smoke test
        run: |
          specfreeze demo --out "$RUNNER_TEMP/demo" --quiet
          specfreeze verify "$RUNNER_TEMP/demo/portion.py" --contract "$RUNNER_TEMP/demo"
          specfreeze catalog check examples/portion/catalog.yaml src/specfreeze/data/catalogs/general.yaml
